<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical English</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f6f4;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.page{max-width:760px;margin:0 auto;padding:60px 24px}
.header{margin-bottom:40px}
.title{font-size:42px;font-weight:600;margin:0}
.subtitle{margin-top:8px;color:#888;font-size:17px}
.card,.note-card{background:#fff;border-radius:20px;padding:32px;margin-bottom:24px}
.section{margin-bottom:32px}.section:last-child{margin-bottom:0}
.section-title{font-size:25px;font-weight:600;margin-bottom:10px}
.section-text{color:#888;line-height:1.6;margin-bottom:20px}
button{border:none;cursor:pointer;font-size:16px;border-radius:12px;padding:14px 20px}
.primary-btn{width:100%;background:#222;color:#fff}
.secondary-btn{width:100%;background:#fff;border:1px solid #ddd;color:#333}
.divider{height:1px;background:#eee;margin:32px 0}
.stats{text-align:center;margin-top:30px}.stats-number{font-size:46px;font-weight:600}.stats-label{color:#999;margin-top:4px}
.form-page,.list-page{display:none}
.back-btn{background:none;padding:0;color:#777;margin-bottom:24px}
.field{margin-bottom:24px}
label{display:block;margin-bottom:10px;font-weight:500}
input,textarea{width:100%;border:none;background:#f7f7f7;border-radius:12px;padding:16px;font-size:16px;color:#222;font-family:inherit}
input{height:52px}textarea{min-height:150px;resize:vertical}.small{min-height:100px}
.save-btn{width:100%;background:#222;color:#fff;margin-top:5px}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:16px}
.topic{color:#777;font-size:14px;font-weight:600}.date{color:#aaa;font-size:13px;white-space:nowrap}
.sentence{font-size:19px;line-height:1.6}.meaning{margin-top:16px;padding-top:16px;border-top:1px solid #eee;color:#777;line-height:1.6}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.listen-btn,.delete-btn{background:#fff;border:1px solid #ddd;padding:9px 16px;border-radius:20px;font-size:14px}
.delete-btn{color:#999}
.empty{text-align:center;color:#aaa;padding:80px 20px}
@media(max-width:600px){.page{padding:40px 18px}.title{font-size:36px}.card{padding:24px}}
</style>
</head>

<body>

<!-- Home -->
<div id="homePage" class="page">
  <div class="header">
    <h1 class="title">Medical English</h1>
    <div class="subtitle">Your clinical English notebook</div>
  </div>

  <div class="card">
    <div class="section">
      <div class="section-title">Today's learning</div>
      <div class="section-text">
        Save useful sentences from your medical English practice.
      </div>
      <button class="primary-btn" onclick="showAddPage()">＋ Add a sentence</button>
    </div>

    <div class="divider"></div>

    <div class="section">
      <div class="section-title">My Notes</div>
      <div class="section-text">
        Browse all the medical English sentences you've saved.
      </div>
      <button class="secondary-btn" onclick="showNotesPage()">View my notes</button>
    </div>
  </div>

  <div class="stats">
    <div id="noteCount" class="stats-number">0</div>
    <div class="stats-label">sentences saved</div>
  </div>
</div>


<!-- Add -->
<div id="addPage" class="page form-page">
  <button class="back-btn" onclick="showHome()">← Back</button>

  <div class="header">
    <h1 class="title">Medical English</h1>
    <div class="subtitle">Add a learning note</div>
  </div>

  <div class="card">
    <div class="field">
      <label>Topic</label>
      <input id="topicInput" placeholder="e.g. Ischemic Stroke">
    </div>

    <div class="field">
      <label>English sentence</label>
      <textarea id="sentenceInput" placeholder="Type the sentence you want to remember..."></textarea>
    </div>

    <div class="field">
      <label>
        Your understanding
        <span style="color:#999;font-size:13px;">(optional)</span>
      </label>
      <textarea id="meaningInput" class="small" placeholder="中文意思、备注或临床场景..."></textarea>
    </div>

    <button class="save-btn" onclick="saveNote()">Save</button>
  </div>
</div>


<!-- My Notes -->
<div id="notesPage" class="page list-page">
  <button class="back-btn" onclick="showHome()">← Back</button>

  <div class="header">
    <h1 class="title">My Notes</h1>
    <div id="notesSubtitle" class="subtitle">0 sentences saved</div>
  </div>

  <div id="notesList"></div>
</div>


<script>
function getNotes(){
  try{
    return JSON.parse(localStorage.getItem("medicalEnglishNotes") || "[]");
  }catch(e){
    console.error("Storage error:",e);
    return [];
  }
}

function saveNotes(notes){
  localStorage.setItem("medicalEnglishNotes",JSON.stringify(notes));
}

function hideAllPages(){
  document.getElementById("homePage").style.display="none";
  document.getElementById("addPage").style.display="none";
  document.getElementById("notesPage").style.display="none";
}

function showHome(){
  hideAllPages();
  document.getElementById("homePage").style.display="block";
  updateHome();
}

function showAddPage(){
  hideAllPages();
  document.getElementById("addPage").style.display="block";
}

function showNotesPage(){
  hideAllPages();
  document.getElementById("notesPage").style.display="block";
  renderNotes();
}

function updateHome(){
  document.getElementById("noteCount").textContent=getNotes().length;
}

function saveNote(){
  const topic=document.getElementById("topicInput").value.trim();
  const sentence=document.getElementById("sentenceInput").value.trim();
  const meaning=document.getElementById("meaningInput").value.trim();

  if(!sentence){
    alert("Please enter a sentence.");
    return;
  }

  const notes=getNotes();
  notes.unshift({
    id:Date.now(),
    topic:topic || "Uncategorized",
    sentence:sentence,
    meaning:meaning,
    date:new Date().toLocaleDateString()
  });

  saveNotes(notes);

  document.getElementById("topicInput").value="";
  document.getElementById("sentenceInput").value="";
  document.getElementById("meaningInput").value="";

  alert("Saved.");
  showHome();
}

function renderNotes(){
  const notes=getNotes();
  const list=document.getElementById("notesList");

  document.getElementById("notesSubtitle").textContent=
    notes.length+" sentences saved";

  if(notes.length===0){
    list.innerHTML='<div class="empty">No sentences yet.</div>';
    return;
  }

  list.innerHTML=notes.map(note=>`
    <div class="note-card">
      <div class="top-row">
        <div class="topic">${escapeHtml(note.topic)}</div>
        <div class="date">${escapeHtml(note.date)}</div>
      </div>

      <div class="sentence">${escapeHtml(note.sentence)}</div>

      ${note.meaning ? `
        <div class="meaning">${escapeHtml(note.meaning)}</div>
      ` : ""}

      <div class="actions">
        <button class="listen-btn" data-id="${note.id}" onclick="listenNote(this)">
          ▶ Listen
        </button>

        <button class="delete-btn" data-id="${note.id}" onclick="deleteNote(this)">
          Delete
        </button>
      </div>
    </div>
  `).join("");
}


/*
  TTS
  The button only passes the note ID.
  The actual sentence is read from localStorage.
  This avoids putting sentence text into onclick code.
*/
function listenNote(button){
  const id=Number(button.dataset.id);
  const notes=getNotes();
  const note=notes.find(item=>Number(item.id)===id);

  if(!note || !note.sentence){
    alert("No sentence found.");
    return;
  }

  const text=note.sentence;

  if(!window.speechSynthesis){
    alert("Speech synthesis is not available in this browser.");
    return;
  }

  window.speechSynthesis.cancel();

  const utterance=new SpeechSynthesisUtterance(text);
  utterance.lang="en-US";
  utterance.rate=0.9;
  utterance.pitch=1;
  utterance.volume=1;

  utterance.onstart=function(){
    button.textContent="▶ Playing...";
  };

  utterance.onend=function(){
    button.textContent="▶ Listen";
  };

  utterance.onerror=function(event){
    button.textContent="▶ Listen";
    console.error("Speech synthesis error:",event);
    alert("TTS error: "+(event.error || "unknown error"));
  };

  window.speechSynthesis.speak(utterance);
}

function deleteNote(button){
  const id=Number(button.dataset.id);

  if(!confirm("Delete this note?\n\nThis sentence will be removed from My Notes.")){
    return;
  }

  saveNotes(
    getNotes().filter(item=>Number(item.id)!==id)
  );

  renderNotes();
  updateHome();
}

function escapeHtml(text){
  const div=document.createElement("div");
  div.textContent=text || "";
  return div.innerHTML;
}

showHome();
</script>

</body>
</html>
